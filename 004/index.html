<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 判斷力 × AI Agent 架構性缺陷｜Howard Liao Ph.D.</title>
<meta name="description" content="Howard Liao Ph.D.｜當 AI 的答案看起來都對，員工判斷得出錯誤嗎？AI 判斷力培養指南 × AI Agent 五大架構性缺陷，24 頁線上簡報。">
<meta name="theme-color" content="#141B2D">
<link rel="icon" href="assets/howard-liao-portrait-circle.png">
<style>
  :root {
    --ink: #141B2D; --ink2: #232C45; --mist: #F1F3F8; --coral: #F07A4A; --muted: #9AA3B8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: #fff;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex: 0 0 auto; }
  header img { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--coral); pointer-events: none; }
  header .t { min-width: 0; }
  header .t b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .t span { font-size: 12px; color: var(--muted); }
  header a.home { margin-left: auto; color: var(--muted); text-decoration: none; font-size: 13px; white-space: nowrap; }
  header a.home:hover { color: #fff; }
  .stage { position: relative; flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 0 72px; min-height: 0; }
  .frame { position: relative; width: min(100%, calc((100dvh - 150px) * 16 / 9)); aspect-ratio: 16 / 9;
    background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  .frame .slide { position: absolute; inset: 0; background: center / contain no-repeat; opacity: 0; transition: opacity .25s ease; }
  .frame .slide.on { opacity: 1; }
  .frame .shield { position: absolute; inset: 0; z-index: 2; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: rgba(20,27,45,.72); color: #fff; font-size: 22px; cursor: pointer; display: grid; place-items: center; }
  .nav:hover { background: var(--coral); }
  .nav.prev { left: 24px; } .nav.next { right: 24px; }
  footer { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px 14px; }
  .bar { flex: 1; height: 4px; background: var(--ink2); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--coral); transition: width .25s; }
  .count { font-size: 13px; color: var(--muted); min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
  .btn { border: 1px solid #3A4562; background: transparent; color: #fff; border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--coral); color: var(--coral); }
  .grid { position: fixed; inset: 0; z-index: 10; background: rgba(12,16,28,.96); display: none; overflow-y: auto; padding: 24px 16px; }
  .grid.open { display: block; }
  .grid .wrap { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .grid .th { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; background: #fff center / cover no-repeat; cursor: pointer; outline: 2px solid transparent; }
  .grid .th.cur { outline-color: var(--coral); }
  .grid .th span { position: absolute; left: 6px; bottom: 6px; background: rgba(20,27,45,.85); font-size: 12px; padding: 2px 6px; border-radius: 4px; }
  .grid .close { position: sticky; top: 0; float: right; }
  @media (max-width: 640px) { .stage { padding: 0 8px; } .nav { width: 36px; height: 36px; font-size: 18px; } .nav.prev { left: 4px; } .nav.next { right: 4px; } header a.home { display: none; } }
  @media print { body * { display: none !important; } body::after { content: "本簡報僅供線上觀看"; display: block !important; color: #000; } }
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false">
<div class="app">
  <header>
    <img src="assets/howard-liao-portrait-circle.png" alt="" draggable="false">
    <div class="t"><b>當 AI 的答案看起來都對，員工判斷得出錯誤嗎？</b><span>Howard Liao Ph.D.｜Seminar 004</span></div>
    <a class="home" href="../">← Seminar 總目錄</a>
  </header>
  <div class="stage">
    <button class="nav prev" aria-label="上一頁">‹</button>
    <div class="frame" id="frame"><div class="shield"></div></div>
    <button class="nav next" aria-label="下一頁">›</button>
  </div>
  <footer>
    <button class="btn" id="gridBtn">總覽</button>
    <div class="bar"><i id="bar"></i></div>
    <div class="count" id="count">1 / 24</div>
    <button class="btn" id="fsBtn">全螢幕</button>
  </footer>
</div>
<div class="grid" id="grid"><button class="btn close" id="gridClose">關閉</button><div class="wrap" id="gridWrap"></div></div>
<script>
(() => {
  const N = 24, pad = (n) => String(n).padStart(2, "0");
  const frame = document.getElementById("frame"), bar = document.getElementById("bar"), count = document.getElementById("count");
  const slides = [];
  for (let i = 1; i <= N; i++) {
    const d = document.createElement("div");
    d.className = "slide";
    d.dataset.src = "slides/" + pad(i) + ".webp";
    frame.insertBefore(d, frame.lastElementChild);
    slides.push(d);
  }
  const load = (i) => { const d = slides[i]; if (d && !d.style.backgroundImage) d.style.backgroundImage = "url(" + d.dataset.src + ")"; };
  let cur = 0;
  const fromHash = () => { const m = location.hash.match(/^#(\d+)$/); return m ? Math.min(Math.max(+m[1], 1), N) - 1 : 0; };
  function go(i) {
    cur = Math.min(Math.max(i, 0), N - 1);
    slides.forEach((d, k) => d.classList.toggle("on", k === cur));
    [cur, cur + 1, cur - 1, cur + 2].forEach(load);
    bar.style.width = ((cur + 1) / N * 100) + "%";
    count.textContent = (cur + 1) + " / " + N;
    history.replaceState(null, "", "#" + (cur + 1));
    document.querySelectorAll(".grid .th").forEach((t, k) => t.classList.toggle("cur", k === cur));
  }
  document.querySelector(".prev").onclick = () => go(cur - 1);
  document.querySelector(".next").onclick = () => go(cur + 1);
  frame.addEventListener("click", (e) => { const r = frame.getBoundingClientRect(); go(e.clientX - r.left < r.width / 3 ? cur - 1 : cur + 1); });
  document.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ["s", "p", "u"].includes(k)) { e.preventDefault(); return; }
    if (["arrowright", "pagedown", " ", "enter"].includes(k)) { e.preventDefault(); go(cur + 1); }
    else if (["arrowleft", "pageup", "backspace"].includes(k)) { e.preventDefault(); go(cur - 1); }
    else if (k === "home") go(0); else if (k === "end") go(N - 1);
    else if (k === "f") toggleFs(); else if (k === "escape") grid.classList.remove("open");
  });
  let sx = null;
  frame.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
  frame.addEventListener("touchend", (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(dx < 0 ? cur + 1 : cur - 1); sx = null; });
  function toggleFs() { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  document.getElementById("fsBtn").onclick = toggleFs;
  const grid = document.getElementById("grid"), wrap = document.getElementById("gridWrap");
  for (let i = 1; i <= N; i++) {
    const t = document.createElement("div");
    t.className = "th"; t.innerHTML = "<span>" + i + "</span>";
    t.onclick = () => { grid.classList.remove("open"); go(i - 1); };
    wrap.appendChild(t);
  }
  document.getElementById("gridBtn").onclick = () => {
    wrap.querySelectorAll(".th").forEach((t, k) => { if (!t.style.backgroundImage) t.style.backgroundImage = "url(slides/t" + pad(k + 1) + ".webp)"; });
    grid.classList.add("open");
  };
  document.getElementById("gridClose").onclick = () => grid.classList.remove("open");
  window.addEventListener("hashchange", () => go(fromHash()));
  go(fromHash());
})();
</script>
</body>
</html>
